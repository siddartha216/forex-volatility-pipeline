name: Daily Forex Pipeline

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Load the last 90 days"
        required: true
        default: false
        type: boolean

concurrency:
  group: forex-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load rates with the service-account secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          set -eu
          test -n "$GCP_SA_KEY" || {
            echo "Missing GCP_SA_KEY repository secret"
            exit 1
          }
          KEY_FILE="$RUNNER_TEMP/gcp-key.json"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$GCP_SA_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          if [ "$BACKFILL" = "true" ]; then
            python pipeline/ingest.py --backfill
          else
            python pipeline/ingest.py
          fi

      - name: Publish refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update forex dashboard data"
          git push
